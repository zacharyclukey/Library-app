<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#22304d" />
  <title>Shelfie — Your Book Library</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">📚</span>
      <span class="brand-name">Shelfie</span>
    </div>
    <button id="profile-chip" class="profile-chip" title="Switch profile">
      <span class="avatar" id="profile-avatar">?</span>
      <span id="profile-name">Set profile</span>
    </button>
  </header>

  <nav class="shelf-tabs" role="tablist">
    <button class="tab active" data-shelf="owned" role="tab" aria-selected="true">
      <span class="tab-icon">📗</span>
      <span class="tab-label">Owned</span>
      <span class="count" id="count-owned">0</span>
    </button>
    <button class="tab" data-shelf="tbr" role="tab" aria-selected="false">
      <span class="tab-icon">🔖</span>
      <span class="tab-label">To Read</span>
      <span class="count" id="count-tbr">0</span>
    </button>
    <button class="tab" data-shelf="completed" role="tab" aria-selected="false">
      <span class="tab-icon">✅</span>
      <span class="tab-label">Finished</span>
      <span class="count" id="count-completed">0</span>
    </button>
    <button class="tab" data-shelf="wishlist" role="tab" aria-selected="false">
      <span class="tab-icon">🎁</span>
      <span class="tab-label">Wishlist</span>
      <span class="count" id="count-wishlist">0</span>
    </button>
  </nav>

  <main>
    <div class="toolbar">
      <div class="search-row">
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true">🔍</span>
          <input type="search" id="list-search" placeholder="Search this shelf…" autocomplete="off" />
        </label>
        <button id="filter-toggle" class="tool-btn" aria-expanded="false" title="Filters and sorting">
          <span aria-hidden="true">⚙</span>
          <span class="tool-label">Filters</span>
          <span id="filter-count" class="count hidden"></span>
        </button>
        <button id="view-toggle" class="tool-btn icon-only" title="Switch between grid and list">▤</button>
      </div>
      <div id="filter-panel" class="filter-panel hidden"></div>
      <div id="profile-filter" class="profile-filter"></div>
      <p id="shelf-summary" class="shelf-summary"></p>
    </div>

    <section id="book-list" class="book-list grid" aria-live="polite"></section>

    <div id="empty-state" class="empty-state hidden">
      <span class="empty-art" aria-hidden="true">📚</span>
      <p id="empty-text">No books on this shelf yet.</p>
      <button id="empty-action" class="primary-btn">＋ Add your first book</button>
    </div>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-shelves">
      <span class="nav-icon" aria-hidden="true">📚</span><span>Shelves</span>
    </button>
    <button class="nav-btn" id="discover-btn">
      <span class="nav-icon" aria-hidden="true">✨</span><span>Discover</span>
    </button>
    <button class="nav-fab" id="add-book-btn" title="Add a book" aria-label="Add a book">＋</button>
    <button class="nav-btn" id="export-btn">
      <span class="nav-icon" aria-hidden="true">📤</span><span>Export</span>
    </button>
    <button class="nav-btn" id="settings-btn">
      <span class="nav-icon" aria-hidden="true">⚙️</span><span>Settings</span>
      <span id="sync-dot" class="sync-dot hidden">●</span>
    </button>
  </nav>

  <!-- ============ Add Book modal ============ -->
  <dialog id="add-modal" class="modal">
    <div class="modal-header">
      <h2>Add a Book</h2>
      <button class="close-btn" data-close="add-modal" aria-label="Close">✕</button>
    </div>

    <div class="add-methods">
      <button id="method-camera" class="method-btn">
        <span class="method-icon">📷</span>
        <span class="method-label">Live camera scan</span>
        <span class="method-hint">Point at the barcode</span>
      </button>
      <button id="method-photo" class="method-btn">
        <span class="method-icon">🖼️</span>
        <span class="method-label">Take / upload a picture</span>
        <span class="method-hint">Works with several books in one shot</span>
      </button>
      <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
    </div>

    <div id="scanner-area" class="scanner-area hidden">
      <video id="scanner-video" playsinline muted></video>
      <div class="scan-line"></div>
      <button id="stop-scan-btn" class="secondary-btn">Stop camera</button>
    </div>

    <p id="scan-status" class="scan-status"></p>

    <div class="manual-entry">
      <h3>Or enter it manually</h3>
      <form id="isbn-form" class="inline-form">
        <input type="text" id="isbn-input" inputmode="numeric"
               placeholder="ISBN (10 or 13 digits)" autocomplete="off" />
        <button type="submit" class="primary-btn">Look up</button>
      </form>
      <form id="title-form" class="inline-form">
        <input type="text" id="title-input" placeholder="Search by title / author" autocomplete="off" />
        <button type="submit" class="primary-btn">Search</button>
      </form>
      <div id="search-results" class="search-results"></div>
    </div>
  </dialog>

  <!-- ============ Confirm Book modal ============ -->
  <dialog id="confirm-modal" class="modal">
    <div class="modal-header">
      <h2>Add to which shelf?</h2>
      <button class="close-btn" data-close="confirm-modal" aria-label="Close">✕</button>
    </div>
    <div id="confirm-book" class="confirm-book"></div>
    <div class="shelf-choice">
      <button class="shelf-pick" data-add-shelf="owned"><span>📗</span> Owned</button>
      <button class="shelf-pick" data-add-shelf="tbr"><span>🔖</span> To Read</button>
      <button class="shelf-pick" data-add-shelf="completed"><span>✅</span> Finished</button>
      <button class="shelf-pick" data-add-shelf="wishlist"><span>🎁</span> Wishlist</button>
    </div>
    <label class="also-own">
      <input type="checkbox" id="also-own-checkbox" checked />
      Also mark as owned (for To Read / Finished)
    </label>
  </dialog>

  <!-- ============ Book detail modal ============ -->
  <dialog id="detail-modal" class="modal">
    <div class="modal-header">
      <h2>Book Details</h2>
      <button class="close-btn" data-close="detail-modal" aria-label="Close">✕</button>
    </div>
    <div id="detail-content"></div>
  </dialog>

  <!-- ============ Profile modal ============ -->
  <dialog id="profile-modal" class="modal">
    <div class="modal-header">
      <h2>👤 Profiles</h2>
      <button class="close-btn" data-close="profile-modal" aria-label="Close">✕</button>
    </div>
    <div id="profile-content"></div>
  </dialog>

  <!-- ============ Discover modal ============ -->
  <dialog id="discover-modal" class="modal">
    <div class="modal-header">
      <h2>✨ Recommended for you</h2>
      <button class="close-btn" data-close="discover-modal" aria-label="Close">✕</button>
    </div>
    <div id="discover-content"></div>
  </dialog>

  <!-- ============ Export modal ============ -->
  <dialog id="export-modal" class="modal">
    <div class="modal-header">
      <h2>📤 Export a shelf</h2>
      <button class="close-btn" data-close="export-modal" aria-label="Close">✕</button>
    </div>
    <div id="export-content"></div>
  </dialog>

  <!-- ============ Settings modal ============ -->
  <dialog id="settings-modal" class="modal">
    <div class="modal-header">
      <h2>⚙️ Settings</h2>
      <button class="close-btn" data-close="settings-modal" aria-label="Close">✕</button>
    </div>
    <div id="settings-content"></div>
    <input type="file" id="import-input" accept="application/json" hidden />
  </dialog>

  <!-- ============ Shared library (sync) modal ============ -->
  <dialog id="sync-modal" class="modal">
    <div class="modal-header">
      <h2>👩‍❤️‍👨 Shared Library</h2>
      <button class="close-btn" data-close="sync-modal" aria-label="Close">✕</button>
    </div>
    <div id="sync-content"></div>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
