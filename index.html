<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#22304d" />
  <title>Shelfie — Your Book Library</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <script>
    // Apply the saved aesthetic before first paint so there's no flash of
    // the default theme. js/themes.js owns this from then on.
    (function () {
      try {
        var root = document.documentElement;
        var skin = localStorage.getItem("shelfie.skin.v1") || "reading-room";
        var mode = localStorage.getItem("shelfie.mode.v1") ||
                   localStorage.getItem("shelfie.theme.v1") || "auto";
        if (mode === "auto") {
          mode = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        }
        root.setAttribute("data-skin", skin);
        root.setAttribute("data-mode", mode);
      } catch (e) {
        document.documentElement.setAttribute("data-skin", "reading-room");
      }
    })();
  </script>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-bar">
    <div class="brand">
      <span class="brand-mark">📚</span>
      <span class="brand-name">Shelfie</span>
    </div>
    <button id="profile-chip" class="profile-chip" title="Switch profile">
      <span class="avatar" id="profile-avatar">?</span>
      <span id="profile-name">Set profile</span>
    </button>
  </header>

  <main>
  <section id="screen-shelves" class="screen active">
  <nav class="shelf-tabs" role="tablist">
    <button class="tab active" data-shelf="owned" role="tab" aria-selected="true">
      <span class="tab-icon" data-ico="books"></span>
      <span class="tab-label">Owned</span>
      <span class="count" id="count-owned">0</span>
    </button>
    <button class="tab" data-shelf="tbr" role="tab" aria-selected="false">
      <span class="tab-icon" data-ico="bookmark"></span>
      <span class="tab-label">To Read</span>
      <span class="count" id="count-tbr">0</span>
    </button>
    <button class="tab" data-shelf="completed" role="tab" aria-selected="false">
      <span class="tab-icon" data-ico="check"></span>
      <span class="tab-label">Finished</span>
      <span class="count" id="count-completed">0</span>
    </button>
    <button class="tab" data-shelf="wishlist" role="tab" aria-selected="false">
      <span class="tab-icon" data-ico="gift"></span>
      <span class="tab-label">Wishlist</span>
      <span class="count" id="count-wishlist">0</span>
    </button>
  </nav>

    <button id="profile-banner" class="profile-banner hidden">
      <span data-ico="user"></span> Who's using this phone? <span class="banner-action">Choose a profile</span>
    </button>
    <button id="request-banner" class="profile-banner request hidden"></button>
    <div id="nudge-card" class="nudge hidden"></div>
    <button id="shelf-hero" class="shelf-hero"></button>
    <p id="net-pill" class="net-pill hidden"></p>
    <div class="toolbar">
      <div class="search-row">
        <label class="search-wrap">
          <span class="search-icon" aria-hidden="true" data-ico="search"></span>
          <input type="search" id="list-search" placeholder="Search this shelf…" autocomplete="off" />
        </label>
        <button id="filter-toggle" class="tool-btn" aria-expanded="false" title="Sort and filter this shelf">
          <span aria-hidden="true" data-ico="sliders"></span>
          <span class="tool-label">Sort<span class="tool-label-more"> &amp; filter</span></span>
          <span id="filter-count" class="count hidden"></span>
        </button>
        <button id="view-toggle" class="tool-btn icon-only" title="Switch between grid and list"></button>
      </div>
      <div id="filter-panel" class="filter-panel hidden"></div>
      <div id="profile-filter" class="profile-filter"></div>
      <p id="shelf-summary" class="shelf-summary"></p>
    </div>

    <div class="list-wrap">
      <section id="book-list" class="book-list grid" aria-live="polite"></section>
      <nav id="az-rail" class="az-rail hidden" aria-label="Jump to letter"></nav>
    </div>
    <div id="list-sentinel" aria-hidden="true"></div>

    <div id="empty-state" class="empty-state hidden">
      <span class="empty-art" aria-hidden="true">📚</span>
      <p id="empty-text">No books on this shelf yet.</p>
      <button id="empty-action" class="primary-btn">＋ Add your first book</button>
    </div>
  </section>

  <!-- ============ Discover screen ============ -->
  <section id="screen-discover" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back aria-label="Back to shelves" data-ico="chevronLeft"></button>
      <h2><span data-ico="sparkles"></span> Recommended for you</h2>
    </div>
    <div class="screen-body" id="discover-content"></div>
  </section>

  <!-- ============ Export screen ============ -->
  <section id="screen-export" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back aria-label="Back to shelves" data-ico="chevronLeft"></button>
      <h2><span data-ico="share"></span> Export a shelf</h2>
    </div>
    <div class="screen-body" id="export-content"></div>
  </section>

  <!-- ============ Settings screen ============ -->
  <section id="screen-settings" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back aria-label="Back to shelves" data-ico="chevronLeft"></button>
      <h2><span data-ico="gear"></span> Settings</h2>
    </div>
    <div class="screen-body" id="settings-content"></div>
    <input type="file" id="import-input" accept="application/json" hidden />
  </section>

  <!-- ============ Profile screen ============ -->
  <section id="screen-profile" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back="settings" aria-label="Back" data-ico="chevronLeft"></button>
      <h2><span data-ico="user"></span> Profiles</h2>
    </div>
    <div class="screen-body" id="profile-content"></div>
  </section>

  <!-- ============ Stats screen ============ -->
  <section id="screen-stats" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back aria-label="Back to shelves" data-ico="chevronLeft"></button>
      <h2><span data-ico="books"></span> Your reading</h2>
    </div>
    <div class="screen-body" id="stats-content"></div>
  </section>

  <!-- ============ Shared library screen ============ -->
  <section id="screen-sync" class="screen">
    <div class="screen-head">
      <button class="back-btn" data-back="settings" aria-label="Back" data-ico="chevronLeft"></button>
      <h2><span data-ico="users"></span> Shared Library</h2>
    </div>
    <div class="screen-body" id="sync-content"></div>
  </section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-btn active" id="nav-shelves">
      <span class="nav-icon" aria-hidden="true" data-ico="books"></span><span>Shelves</span>
    </button>
    <button class="nav-btn" id="discover-btn">
      <span class="nav-icon" aria-hidden="true" data-ico="sparkles"></span><span>Discover</span>
    </button>
    <button class="nav-fab" id="add-book-btn" title="Add a book" aria-label="Add a book" data-ico="plus"></button>
    <button class="nav-btn" id="export-btn">
      <span class="nav-icon" aria-hidden="true" data-ico="share"></span><span>Export</span>
    </button>
    <button class="nav-btn" id="settings-btn">
      <span class="nav-icon" aria-hidden="true" data-ico="gear"></span><span>Settings</span>
      <span id="sync-dot" class="sync-dot hidden">●</span>
    </button>
  </nav>

  <!-- ============ Add Book modal ============ -->
  <dialog id="add-modal" class="modal sheet">
    <div class="modal-header">
      <h2>Add a Book</h2>
      <button class="close-btn" data-close="add-modal" aria-label="Close" data-ico="close"></button>
    </div>

    <div class="add-methods">
      <button id="method-camera" class="method-btn">
        <span class="method-icon" data-ico="camera"></span>
        <span class="method-label">Live camera scan</span>
        <span class="method-hint">Point at the barcode</span>
      </button>
      <button id="method-photo" class="method-btn">
        <span class="method-icon" data-ico="image"></span>
        <span class="method-label">Take / upload a picture</span>
        <span class="method-hint">Works with several books in one shot</span>
      </button>
      <input type="file" id="photo-input" accept="image/*" capture="environment" hidden />
    </div>

    <div id="scanner-area" class="scanner-area hidden">
      <video id="scanner-video" playsinline muted></video>
      <div class="scan-line"></div>
      <button id="stop-scan-btn" class="secondary-btn">Stop camera</button>
    </div>

    <p id="scan-status" class="scan-status"></p>

    <div class="manual-entry">
      <h3>Or enter it manually</h3>
      <form id="isbn-form" class="inline-form">
        <input type="text" id="isbn-input" inputmode="numeric"
               placeholder="ISBN (10 or 13 digits)" autocomplete="off" />
        <button type="submit" class="primary-btn">Look up</button>
      </form>
      <form id="title-form" class="inline-form">
        <input type="text" id="title-input" placeholder="Search by title / author" autocomplete="off" />
        <select id="search-lang" class="lang-select" title="Search language"></select>
        <button type="submit" class="primary-btn">Search</button>
      </form>
      <div id="search-results" class="search-results"></div>
    </div>
  </dialog>

  <!-- ============ Confirm Book modal ============ -->
  <dialog id="confirm-modal" class="modal sheet">
    <div class="modal-header">
      <h2>Add to which shelf?</h2>
      <button class="close-btn" data-close="confirm-modal" aria-label="Close" data-ico="close"></button>
    </div>
    <div id="confirm-book" class="confirm-book"></div>
    <div class="filter-group hidden" id="medium-group" style="margin-bottom:0.7rem">
      <span class="filter-label">Copy type</span>
      <div class="profile-filter" id="medium-choice" style="margin-top:0.25rem">
        <button class="filter-chip active" data-medium="print">📕 Print</button>
        <button class="filter-chip" data-medium="ebook">📱 E-book / Kindle</button>
        <button class="filter-chip" data-medium="audio">🎧 Audiobook / Audible</button>
      </div>
    </div>
    <div class="shelf-choice">
      <button class="shelf-pick" data-add-shelf="owned"><span data-ico="books"></span> Owned</button>
      <button class="shelf-pick" data-add-shelf="tbr"><span data-ico="bookmark"></span> To Read</button>
      <button class="shelf-pick" data-add-shelf="completed"><span data-ico="check"></span> Finished</button>
      <button class="shelf-pick" data-add-shelf="wishlist"><span data-ico="gift"></span> Wishlist</button>
    </div>
    <label class="also-own">
      <input type="checkbox" id="also-own-checkbox" checked />
      I own this copy — uncheck for library loans, Kindle&nbsp;Unlimited,
      borrowed audiobooks, etc. (To Read / Finished only)
    </label>
  </dialog>

  <!-- ============ Book detail modal ============ -->
  <dialog id="detail-modal" class="modal sheet">
    <div class="modal-header">
      <h2>Book Details</h2>
      <button class="close-btn" data-close="detail-modal" aria-label="Close" data-ico="close"></button>
    </div>
    <div id="detail-content"></div>
  </dialog>






  <div id="toast-region" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
